name: Contract and interface checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    uses: BreadchainCoop/etherform/.github/workflows/_ci.yml@180aa91926a02ce2045f9a7e3ed08be9395ecfab
    with:
      package-manager: npm
      foundry-version: v1.5.1
      check-formatting: false
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: forge build
      - run: npm run test:automation
      - run: npm run test:deployment
      - run: npm run build:gnosis
      - run: npx playwright install --with-deps chromium
      - name: Local chain, browser claim and interface tests
        run: |
          npm run chain > /tmp/mergebounty-chain.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:8547 -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' >/dev/null && break; sleep 1; done
          npm run deploy:local
          npm run dev > /tmp/mergebounty-dev.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:5174 >/dev/null && break; sleep 1; done
          npm run test:chain
          npm run test:ui
      # Gnosis tests require explicit opt-in, a funded signer, and original emails.
      # Neither real email data nor signing secrets is included in CI artifacts.
