name: Contract and interface checks
on: [push, pull_request]
jobs:
  contracts:
    uses: BreadchainCoop/etherform/.github/workflows/_ci.yml@180aa91926a02ce2045f9a7e3ed08be9395ecfab
    with:
      package-manager: npm
      foundry-version: v1.5.1
      check-formatting: false
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Frontend state tests (controlled API fixtures)
        run: |
          npm run dev > /tmp/mergebounty-dev.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:5174 >/dev/null && break; sleep 1; done
          npm run test:ui
      # Real DKIM/ZK/ETH tests are run locally with private original emails and
      # the multi-gigabyte proving artifacts; neither belongs in this workflow.
