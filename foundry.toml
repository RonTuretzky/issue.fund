[profile.default]
src = "contracts"
test = "contracts/test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]

fs_permissions = [{ access = "read", path = "tests/fixtures/rsa-vectors.json" }]

[fuzz]
runs = 128
