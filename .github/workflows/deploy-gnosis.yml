name: Deploy Gnosis experimental contracts
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  deploy:
    uses: BreadchainCoop/etherform/.github/workflows/_deploy-testnet.yml@180aa91926a02ce2045f9a7e3ed08be9395ecfab
    with:
      environment: gnosis
      package-manager: npm
      foundry-version: v1.5.1
      deploy-script: script/Deploy.s.sol:Deploy
    secrets:
      PRIVATE_KEY: ${{ secrets.GNOSIS_DEPLOYER_KEY }}
      RPC_URL: ${{ secrets.GNOSIS_RPC_URL }}
      DEPLOY_ENV_VARS: ${{ secrets.GNOSIS_DEPLOY_ENV_VARS }}
